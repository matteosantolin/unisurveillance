# Cloud Build pipeline for dashboard (path filter: dashboard/**):
# 1. install dependencies
# 2. Vite build with VITE_FIREBASE_* env vars (Firebase web config is public by design)
# 3. deploy Firebase Hosting + firestore.rules + storage.rules
#
# Recommended trigger: 2nd gen, branch ^master$, included files filter "dashboard/**",
# config file "dashboard/cloudbuild.yaml".
#
# Set substitution values in the Cloud Build trigger settings (Google Cloud Console),
# NOT here — keeps credentials out of the repo.
# Required substitutions: _VITE_FIREBASE_API_KEY, _VITE_FIREBASE_AUTH_DOMAIN,
# _VITE_FIREBASE_PROJECT_ID, _VITE_FIREBASE_STORAGE_BUCKET,
# _VITE_FIREBASE_MESSAGING_SENDER_ID, _VITE_FIREBASE_APP_ID

steps:
  - id: install
    name: 'node:20'
    entrypoint: npm
    args: ['ci']
    dir: 'dashboard'

  - id: build
    name: 'node:20'
    entrypoint: npm
    args: ['run', 'build']
    dir: 'dashboard'
    env:
      - 'VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}'
      - 'VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}'
      - 'VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}'
      - 'VITE_FIREBASE_STORAGE_BUCKET=${_VITE_FIREBASE_STORAGE_BUCKET}'
      - 'VITE_FIREBASE_MESSAGING_SENDER_ID=${_VITE_FIREBASE_MESSAGING_SENDER_ID}'
      - 'VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}'

  - id: deploy
    name: 'node:20'
    entrypoint: bash
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy --only=hosting,firestore:rules,storage --project=unisurveillance --non-interactive
    dir: 'dashboard'
    env:
      - 'NO_UPDATE_NOTIFIER=1'

options:
  logging: CLOUD_LOGGING_ONLY
